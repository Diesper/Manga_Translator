name: Extract audit folders

on:
  push:
    branches:
      - auditoria
    paths:
      - "auditoria.7z"
      - ".github/workflows/extract-auditoria.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout auditoria
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract auditoria.7z
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          7z x -y auditoria.7z -o.
          rm -f auditoria.7z

      - name: Commit extracted audit folders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(auditoria): extract audit folders"
          git push origin HEAD:auditoria
