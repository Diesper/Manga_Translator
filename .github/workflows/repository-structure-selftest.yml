name: Repository Structure Selftest

on:
  pull_request:
    paths:
      - 'scripts/validation/verify-repository-structure.js'
      - 'docs/biblia/.coordination/verify-repository-structure-selftest.js'
      - '.github/workflows/repository-structure-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run repository structure adversarial selftest
        run: node docs/biblia/.coordination/verify-repository-structure-selftest.js
