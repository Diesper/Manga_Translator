name: Bible Final Readiness

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - reopened

jobs:
  final-readiness:
    name: Bible Final Readiness
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bible-final')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Canonical Bible final readiness
        run: npm run bible:final-readiness
