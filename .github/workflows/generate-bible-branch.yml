name: Generate project Bible

on:
  push:
    branches:
      - docs/project-bible

permissions:
  contents: write

jobs:
  generate-bible:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate docs/Bíblia.md
        run: node scripts/docs/generate-bible.js

      - name: Commit generated Bible
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/Bíblia.md"
          if git diff --cached --quiet; then
            echo "Bíblia already up to date."
            exit 0
          fi
          git commit -m "docs: refresh project Bible after gate fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
