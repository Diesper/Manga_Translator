name: Load Content Script Selftest

on:
  pull_request:
    paths:
      - 'tests/helpers/load-content-script.js'
      - 'extension/manifest.json'
      - 'docs/biblia/.coordination/load-content-script-selftest.test.js'
      - '.github/workflows/load-content-script-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run helper selftest with open-handle detection
        run: npx jest --config jest.config.js --selectProjects content-scripts --runInBand --detectOpenHandles --runTestsByPath docs/biblia/.coordination/load-content-script-selftest.test.js

      - name: Run related content-script unit suite
        run: npm run test:unit:content -- --runInBand
