name: Jobs DOM ACK Selftest

on:
  pull_request:
    paths:
      - 'extension/background/jobs-dom-ack.js'
      - 'extension/content/content_manga.js'
      - 'extension/background/actions/deliver-result-from-tab.js'
      - 'tests/mocks/**'
      - 'jest.config.js'
      - 'docs/biblia/.coordination/jobs-dom-ack-selftest.js'
      - '.github/workflows/jobs-dom-ack-selftest.yml'
  workflow_dispatch:

jobs:
  focal-and-background:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DOM ACK focal selftest
        run: node docs/biblia/.coordination/jobs-dom-ack-selftest.js

      - name: Run background unit suite with open-handle detection
        run: npx jest --config jest.config.js --selectProjects background --runInBand --detectOpenHandles
