name: Bible Handoff Guard

on:
  push:
    branches:
      - docs/project-bible
  workflow_dispatch:

concurrency:
  group: bible-handoff-guard-${{ github.ref }}
  # Do not cancel the running proof on each distributed push; otherwise a busy branch can starve forever.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  handoff-guard:
    name: Protected Handoff Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Syntax check handoff guard
        run: |
          node --check scripts/bible/core/audit-core.js
          node --check scripts/bible/commands/audit-result.js
          node --check scripts/bible/commands/audit-protocol.js
          node --check scripts/bible/commands/handoff-guard.js
          node --check scripts/bible/core/lifecycle-core.js
          node --check scripts/bible/core/human-gate.js
          node --check scripts/bible/storage/unverified-findings.js
          node --check scripts/bible/storage/unverified-finding-events.js
          node --check scripts/bible/commands/unverified-finding-transition.js
          node --check scripts/bible/commands/unit-transition.js
          node --check tests/infra/bible/anti-loop-integration-selftest.js
          node --check tests/infra/bible/anti-loop-adversarial-selftest.js
          node --check scripts/bible/storage/human-review.js
          node --check scripts/validation/verify-human-protected-diff.js
          node --check scripts/validation/verify-human-protected-diff-selftest.js
          node --check scripts/validation/verify-bible-state-history-append-only.js
          node --check scripts/validation/verify-bible-state-history-append-only-selftest.js
          node --check scripts/validation/verify-unverified-findings-append-only.js
          node --check scripts/validation/verify-unverified-findings-append-only-selftest.js
          node --check scripts/validation/verify-bible-protocol-governance.js
          node --check scripts/validation/verify-bible-protocol-governance-selftest.js
          node --check scripts/validation/bible-lifecycle-metrics.js
          node --check scripts/validation/bible-lifecycle-metrics-selftest.js
          node --check scripts/validation/bible-anti-loop-adversarial-selftest.js

      - name: Prove handoff fence and transition rules
        run: |
          node scripts/validation/verify-bible-audit-pipeline-selftest.js
          node tests/infra/bible/bible-correction-work-plan-selftest.js
          node tests/infra/bible/reconcile-audit-results-selftest.js
          node tests/infra/bible/lifecycle-core-selftest.js
          node tests/infra/bible/human-gate-selftest.js
          node tests/infra/bible/unverified-findings-selftest.js
          node tests/infra/bible/unverified-finding-events-selftest.js
          node tests/infra/bible/unit-transition-selftest.js
          node tests/infra/bible/anti-loop-integration-selftest.js
          node tests/infra/bible/anti-loop-adversarial-selftest.js
          node tests/infra/bible/human-review-selftest.js
          node tests/infra/bible/audit-result-selftest.js
          node scripts/validation/verify-human-protected-diff-selftest.js
          node scripts/validation/verify-bible-state-history-append-only-selftest.js
          node scripts/validation/verify-unverified-findings-append-only-selftest.js
          node scripts/validation/verify-bible-protocol-governance.js
          node scripts/validation/verify-bible-protocol-governance-selftest.js
          node scripts/validation/bible-lifecycle-metrics-selftest.js
          node scripts/validation/bible-anti-loop-adversarial-selftest.js

      - name: Validate current protected handoffs
        run: node scripts/bible/commands/handoff-guard.js

      - name: Verify HUMAN protected diff
        run: node scripts/validation/verify-human-protected-diff.js --base "${{ github.event.before }}"

      - name: Verify lifecycle state history append-only
        run: node scripts/validation/verify-bible-state-history-append-only.js --base "${{ github.event.before }}"

      - name: Verify unverified findings append-only
        run: node scripts/validation/verify-unverified-findings-append-only.js --base "${{ github.event.before }}"
