name: Bible Reconciliation Checkpoint

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

permissions:
  contents: write

concurrency:
  group: bible-reconciliation-checkpoint
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Distributed Bible State
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/project-bible' && github.event.label.name == 'bible-reconcile')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: docs/project-bible
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Remember observed head
        id: observed
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate canonical protocol infrastructure before mutation
        run: npm run test:bible-protocol:infra

      - name: Prove published audit results are immutable
        run: npm run bible:audit:append-only

      - name: Reconcile append-only results into compatibility state
        run: npm run bible:reconcile:write

      - name: Remove only conclusively consumed claims and leases
        run: npm run bible:lease-gc:write

      - name: Prove reconciliation idempotence after cleanup
        run: npm run bible:reconcile:check

      - name: Commit checkpoint locally
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No checkpoint changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/biblia
          git commit -m "coord: reconcile distributed Bible checkpoint"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Conditional fast-forward publish
        if: steps.commit.outputs.changed == 'true'
        env:
          OBSERVED_SHA: ${{ steps.observed.outputs.sha }}
        shell: bash
        run: |
          git fetch origin docs/project-bible
          REMOTE_SHA="$(git rev-parse origin/docs/project-bible)"
          if [ "$REMOTE_SHA" != "$OBSERVED_SHA" ]; then
            echo "::error::Branch moved from $OBSERVED_SHA to $REMOTE_SHA while checkpoint was computed. Refusing to overwrite/rebase concurrent work; rerun the checkpoint."
            exit 1
          fi
          git push origin HEAD:docs/project-bible
