name: Bible Reconciliation Checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bible-reconciliation-checkpoint
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Distributed Bible State
    if: github.ref == 'refs/heads/docs/project-bible'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: docs/project-bible
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Remember observed head
        id: observed
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate protocol infrastructure before mutation
        run: |
          node docs/biblia/.coordination/audit-protocol-selftest.js
          node scripts/validation/verify-bible-audit-pipeline-selftest.js
          node scripts/validation/verify-bible-audit-shards-selftest.js
          node docs/biblia/.coordination/reconcile-audit-results-selftest.js
          node scripts/validation/verify-bible-coordination-selftest.js

      - name: Reconcile append-only results into compatibility state
        run: node docs/biblia/.coordination/reconcile-audit-results.js --write

      - name: Remove only conclusively consumed claims and leases
        run: node docs/biblia/.coordination/audit-lease-gc.js --write-safe

      - name: Prove reconciliation idempotence after cleanup
        run: node docs/biblia/.coordination/reconcile-audit-results.js --check

      - name: Commit checkpoint locally
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No checkpoint changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/biblia
          git commit -m "coord: reconcile distributed Bible checkpoint"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Conditional fast-forward publish
        if: steps.commit.outputs.changed == 'true'
        env:
          OBSERVED_SHA: ${{ steps.observed.outputs.sha }}
        shell: bash
        run: |
          git fetch origin docs/project-bible
          REMOTE_SHA="$(git rev-parse origin/docs/project-bible)"
          if [ "$REMOTE_SHA" != "$OBSERVED_SHA" ]; then
            echo "::error::Branch moved from $OBSERVED_SHA to $REMOTE_SHA while checkpoint was computed. Refusing to overwrite/rebase concurrent work; rerun the checkpoint."
            exit 1
          fi
          git push origin HEAD:docs/project-bible
