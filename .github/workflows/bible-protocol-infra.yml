name: Bible Protocol Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - docs/project-bible
    paths:
      - 'docs/biblia/.coordination/audit-core.js'
      - 'docs/biblia/.coordination/audit-result.js'
      - 'docs/biblia/.coordination/audit-result-selftest.js'
      - 'scripts/validation/verify-lifecycle-artifacts-append-only.js'
      - 'docs/biblia/.state/**'
      - 'docs/biblia/.reservas/**'
      - 'docs/biblia/.coordination/audit-results/**'
      - 'docs/biblia/.coordination/audit-leases/**'
      - 'docs/biblia/.coordination/correction-authorizations/**'
      - 'docs/biblia/.coordination/human-approvals/**'
      - 'docs/biblia/.coordination/human-review/**'
      - 'docs/biblia/.coordination/unverified-findings/**'
      - 'docs/biblia/.coordination/unverified-finding-events/**'
      - 'docs/biblia/.coordination/unverified-findings-legacy-baseline.json'
      - 'docs/biblia/.coordination/audit-core-git-selftest.js'
      - 'docs/biblia/.coordination/audit-protocol.js'
      - 'docs/biblia/.coordination/audit-protocol-selftest.js'
      - 'docs/biblia/.coordination/reconcile-audit-results.js'
      - 'docs/biblia/.coordination/reconcile-audit-results-selftest.js'
      - 'docs/biblia/.coordination/audit-lease-gc.js'
      - 'docs/biblia/.coordination/audit-summary.js'
      - 'docs/biblia/.coordination/handoff-guard.js'
      - 'docs/biblia/.coordination/bible-correction-work-plan.js'
      - 'docs/biblia/.coordination/bible-correction-work-plan-selftest.js'
      - 'docs/biblia/.coordination/lifecycle-core.js'
      - 'docs/biblia/.coordination/lifecycle-core-selftest.js'
      - 'docs/biblia/.coordination/human-gate.js'
      - 'docs/biblia/.coordination/human-gate-selftest.js'
      - 'docs/biblia/.coordination/human-approval.js'
      - 'docs/biblia/.coordination/human-review.js'
      - 'docs/biblia/.coordination/human-review-selftest.js'
      - 'docs/biblia/.coordination/unverified-findings.js'
      - 'docs/biblia/.coordination/unverified-findings-selftest.js'
      - 'docs/biblia/.coordination/unverified-finding-events.js'
      - 'docs/biblia/.coordination/unverified-finding-events-selftest.js'
      - 'docs/biblia/.coordination/unverified-finding-transition.js'
      - 'docs/biblia/.coordination/unit-transition.js'
      - 'docs/biblia/.coordination/unit-transition-selftest.js'
      - 'docs/biblia/.coordination/anti-loop-adversarial-selftest.js'
      - 'docs/biblia/.coordination/anti-loop-integration-selftest.js'
      - 'scripts/validation/verify-human-protected-diff.js'
      - 'scripts/validation/verify-human-protected-diff-selftest.js'
      - 'scripts/validation/verify-bible-state-history-append-only.js'
      - 'scripts/validation/verify-bible-state-history-append-only-selftest.js'
      - 'scripts/validation/verify-unverified-findings-append-only.js'
      - 'scripts/validation/verify-unverified-findings-append-only-selftest.js'
      - 'scripts/validation/bible-lifecycle-metrics.js'
      - 'scripts/validation/bible-lifecycle-metrics-selftest.js'
      - 'scripts/validation/bible-anti-loop-adversarial-selftest.js'
      - '.github/workflows/ci.yml'
      - 'scripts/validation/verify-bible-protocol-governance-selftest.js'
      - 'scripts/validation/verify-bible-protocol-governance.js'
      - '.github/workflows/bible-unit-transition.yml'
      - '.github/workflows/bible-human-approval.yml'
      - 'scripts/validation/verify-bible-lifecycle.js'
      - 'scripts/validation/verify-bible-audit-results-append-only.js'
      - 'scripts/validation/verify-bible-audit-results-append-only-selftest.js'
      - 'scripts/validation/bible-audit-pipeline.js'
      - 'scripts/validation/bible-audit-work-plan.js'
      - 'scripts/validation/verify-bible-audit-pipeline-selftest.js'
      - 'scripts/validation/verify-bible-audit-shards-selftest.js'
      - 'scripts/validation/bible-coordination.js'
      - 'scripts/validation/verify-bible-coordination-selftest.js'
      - 'scripts/validation/verify-bible-merge-readiness.js'
      - 'package.json'
      - '.github/workflows/bible-protocol-infra.yml'
      - '.github/workflows/bible-handoff-guard.yml'

concurrency:
  group: bible-protocol-infra-${{ github.ref }}
  # Não cancelar o run ativo: com muitos agentes/pushes, cancel-in-progress=true
  # causa starvation e impede qualquer prova Linux/Windows de terminar.
  # GitHub mantém no máximo um run ativo + um pendente por grupo.
  cancel-in-progress: false

jobs:
  protocol-infra:
    name: Distributed Bible Protocol Infra (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Syntax check coordination modules
        run: |
          node --check docs/biblia/.coordination/audit-core.js
          node --check docs/biblia/.coordination/audit-result.js
          node --check docs/biblia/.coordination/audit-core-git-selftest.js
          node --check docs/biblia/.coordination/audit-protocol.js
          node --check docs/biblia/.coordination/reconcile-audit-results.js
          node --check docs/biblia/.coordination/audit-lease-gc.js
          node --check docs/biblia/.coordination/audit-summary.js
          node --check docs/biblia/.coordination/handoff-guard.js
          node --check docs/biblia/.coordination/bible-correction-work-plan.js
          node --check docs/biblia/.coordination/lifecycle-core.js
          node --check docs/biblia/.coordination/human-gate.js
          node --check docs/biblia/.coordination/human-approval.js
          node --check docs/biblia/.coordination/human-review.js
          node --check docs/biblia/.coordination/unverified-findings.js
          node --check docs/biblia/.coordination/unverified-finding-events.js
          node --check docs/biblia/.coordination/unverified-finding-transition.js
          node --check docs/biblia/.coordination/unit-transition.js
          node --check docs/biblia/.coordination/anti-loop-integration-selftest.js
          node --check docs/biblia/.coordination/anti-loop-adversarial-selftest.js
          node --check scripts/validation/verify-human-protected-diff.js
          node --check scripts/validation/verify-lifecycle-artifacts-append-only.js
          node --check scripts/validation/verify-lifecycle-artifacts-append-only-selftest.js
          node --check scripts/validation/verify-human-protected-diff-selftest.js
          node --check scripts/validation/verify-bible-state-history-append-only.js
          node --check scripts/validation/verify-bible-state-history-append-only-selftest.js
          node --check scripts/validation/verify-unverified-findings-append-only.js
          node --check scripts/validation/verify-unverified-findings-append-only-selftest.js
          node --check scripts/validation/bible-lifecycle-metrics.js
          node --check scripts/validation/bible-lifecycle-metrics-selftest.js
          node --check scripts/validation/bible-anti-loop-adversarial-selftest.js
          node --check scripts/validation/verify-bible-protocol-governance.js
          node --check scripts/validation/verify-bible-protocol-governance-selftest.js
          node --check scripts/validation/verify-bible-lifecycle.js
          node --check scripts/validation/verify-bible-audit-results-append-only.js
          node --check scripts/validation/verify-bible-audit-results-append-only-selftest.js
          node --check scripts/validation/bible-audit-pipeline.js
          node --check scripts/validation/bible-audit-work-plan.js
          node --check scripts/validation/bible-coordination.js
          node --check scripts/validation/verify-bible-merge-readiness.js

      - name: Canonical protocol self-tests
        run: npm run test:bible-protocol:infra

      - name: Anti-loop lifecycle self-tests
        run: |
          node docs/biblia/.coordination/lifecycle-core-selftest.js
          node docs/biblia/.coordination/human-gate-selftest.js
          node docs/biblia/.coordination/unverified-findings-selftest.js
          node docs/biblia/.coordination/unverified-finding-events-selftest.js
          node docs/biblia/.coordination/unit-transition-selftest.js
          node docs/biblia/.coordination/anti-loop-integration-selftest.js
          node docs/biblia/.coordination/anti-loop-adversarial-selftest.js
          node docs/biblia/.coordination/human-review-selftest.js
          node docs/biblia/.coordination/audit-result-selftest.js
          node scripts/validation/verify-lifecycle-artifacts-append-only-selftest.js
          node scripts/validation/verify-human-protected-diff-selftest.js
          node scripts/validation/verify-bible-state-history-append-only-selftest.js
          node scripts/validation/verify-unverified-findings-append-only-selftest.js
          node scripts/validation/bible-lifecycle-metrics-selftest.js
          node scripts/validation/bible-anti-loop-adversarial-selftest.js
          node scripts/validation/verify-bible-protocol-governance.js
          node scripts/validation/verify-bible-protocol-governance-selftest.js

      - name: Validate anti-loop lifecycle
        run: npm run bible:lifecycle:verify

      - name: Report anti-loop lifecycle metrics
        run: npm run bible:lifecycle:metrics

      - name: Validate HUMAN protected diff
        if: github.event_name == 'push'
        run: node scripts/validation/verify-human-protected-diff.js --base "${{ github.event.before }}"

      - name: Enforce lifecycle authority artifacts append-only
        if: github.event_name == 'push'
        run: node scripts/validation/verify-lifecycle-artifacts-append-only.js --base "${{ github.event.before }}"

      - name: Enforce lifecycle state history append-only
        if: github.event_name == 'push'
        run: node scripts/validation/verify-bible-state-history-append-only.js --base "${{ github.event.before }}"

      - name: Enforce unverified findings append-only
        if: github.event_name == 'push'
        run: node scripts/validation/verify-unverified-findings-append-only.js --base "${{ github.event.before }}"

      - name: Enforce append-only audit result history
        run: npm run bible:audit:append-only

      - name: Validate live distributed model
        run: node docs/biblia/.coordination/audit-protocol.js status > audit-protocol-status.txt

      - name: Classify claim and lease garbage safely
        run: node docs/biblia/.coordination/audit-lease-gc.js

      - name: Summarize live distributed model
        run: node docs/biblia/.coordination/audit-summary.js
