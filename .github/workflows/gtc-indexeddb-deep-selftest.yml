name: GTC IndexedDB Deep Selftest

on:
  pull_request:
    paths:
      - 'tests/integration/ipc/gtc-indexeddb-deep.test.js'
      - 'tests/helpers/load-content-script.js'
      - 'tests/mocks/chrome-api.mock.js'
      - 'extension/content/**'
      - 'extension/shared/gtc-indexeddb.js'
      - 'extension/shared/gtc-fingerprint.js'
      - '.github/workflows/gtc-indexeddb-deep-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtc-indexeddb-deep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focal integration three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Focal attempt ${attempt}/3"
            npx jest --config jest.config.js --selectProjects integration --runTestsByPath tests/integration/ipc/gtc-indexeddb-deep.test.js --runInBand --detectOpenHandles
          done

      - name: Run full integration suite
        run: npm run test:integration -- --runInBand
