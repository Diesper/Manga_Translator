name: Export PR45 source for local validation

on:
  push:
    branches:
      - tmp/export-pr45-local-validation

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Pack exact Node runtime
        run: |
          NODE_ROOT="$(dirname "$(dirname "$(which node)")")"
          node --version
          tar -C "$NODE_ROOT" -czf "$RUNNER_TEMP/pr45-node-runtime.tar.gz" bin/node

      - name: Upload Node runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr45-node-runtime
          path: ${{ runner.temp }}/pr45-node-runtime.tar.gz
          retention-days: 1
