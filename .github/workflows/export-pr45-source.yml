name: Export PR45 source for local validation

on:
  push:
    branches:
      - tmp/export-pr45-local-validation

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Pack source outside checkout
        run: |
          tar --exclude='.git' --exclude='node_modules' -czf "$RUNNER_TEMP/pr45-source.tar.gz" .

      - name: Pack test dependencies
        run: |
          tar -C tests -czf "$RUNNER_TEMP/pr45-node_modules.tar.gz" node_modules

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr45-source
          path: ${{ runner.temp }}/pr45-source.tar.gz
          retention-days: 1

      - name: Upload dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr45-node-modules
          path: ${{ runner.temp }}/pr45-node_modules.tar.gz
          retention-days: 1
