name: Reader Offline Selftest

on:
  pull_request:
    paths:
      - 'tests/e2e/reader-offline.spec.js'
      - 'extension/reader/**'
      - 'extension/shared/storage-manager.js'
      - 'tests/fixtures/gemini-mock-server.js'
      - 'playwright.config.js'
      - '.github/workflows/reader-offline-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run reader offline E2E
        env:
          CI: 'true'
          MANGA_E2E_BROWSER_MODE: stealth
          MANGA_E2E_WORKERS: '1'
        run: xvfb-run --auto-servernum -- npx playwright test tests/e2e/reader-offline.spec.js --config=playwright.config.js --workers=1 --retries=0
